name: Deploy Catalog Service to EC2

on:
  push:
    branches:
      - main
      - staging
      - mvp/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar -x test

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          scp -i ~/.ssh/ec2_key.pem \
            $JAR_FILE \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/app.jar

      - name: Deploy and restart service
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo mkdir -p /opt/bidmart-catalog-service &&
            sudo mv /tmp/app.jar /opt/bidmart-catalog-service/app.jar &&
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /opt/bidmart-catalog-service &&
            sudo mkdir -p /etc/bidmart
          "

          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo tee /etc/bidmart/catalog.env > /dev/null" << ENVEOF
          SPRING_PROFILES_ACTIVE=prod
          SPRING_DATASOURCE_URL=${{ secrets.SUPABASE_DB_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SUPABASE_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}
          SPRING_RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          SPRING_RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
          SPRING_RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          SPRING_RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          SPRING_RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}
          SERVER_PORT=8083
          ENVEOF

          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo chmod 600 /etc/bidmart/catalog.env &&
            sudo systemctl daemon-reload &&
            sudo systemctl restart bidmart-catalog-service &&
            sudo systemctl status bidmart-catalog-service --no-pager
          "