name: Publish Test Reports

on:
  push:
    branches: [ "main", "staging" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate reports
        run: ./gradlew --no-daemon clean test functionalTest jacocoTestReport aggregate

      - name: Prepare GitHub Pages bundle
        run: |
          set -euo pipefail
          mkdir -p build/public-test-reports

          cp -R build/reports/tests/test build/public-test-reports/junit-report
          cp -R build/reports/jacoco/test/html build/public-test-reports/jacoco

          if [ -d build/site/serenity ]; then
            cp -R build/site/serenity build/public-test-reports/serenity
          elif [ -d build/serenity ]; then
            cp -R build/serenity build/public-test-reports/serenity
          else
            mkdir -p build/public-test-reports/serenity
            printf '%s\n' '<!DOCTYPE html><html><body><p>Serenity report was not generated in this run.</p></body></html>' \
              > build/public-test-reports/serenity/index.html
          fi

          cat > build/public-test-reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>BidMart Catalog Service Test Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; color: #1f2937; }
              h1 { margin-bottom: 0.5rem; }
              ul { padding-left: 1.25rem; }
              li { margin-bottom: 0.75rem; }
              .meta { color: #4b5563; margin-bottom: 2rem; }
              a { color: #2563eb; text-decoration: none; }
              a:hover { text-decoration: underline; }
              code { background: #f3f4f6; padding: 0.15rem 0.35rem; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>BidMart Catalog Service Test Reports</h1>
            <p class="meta">
              This page is published automatically from GitHub Actions so assistants and graders can review
              the latest unit, coverage, and Serenity functional-testing reports.
            </p>
            <ul>
              <li><a href="./jacoco/index.html">JaCoCo Coverage Report</a></li>
              <li><a href="./junit-report/index.html">JUnit Test Report</a></li>
              <li><a href="./serenity/index.html">Serenity Functional Test Report</a></li>
            </ul>
            <p>
              Generated from branch <code>${{ github.ref_name }}</code> at commit
              <code>${{ github.sha }}</code>.
            </p>
          </body>
          </html>
          EOF

      - name: Upload CI artifact (always available)
        uses: actions/upload-artifact@v4
        with:
          name: catalog-test-reports
          path: build/public-test-reports
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/public-test-reports

  deploy-pages:
    needs: build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
