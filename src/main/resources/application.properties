spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=20000

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=30000

server.port=8083

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VHOST:localhost}

service.auction.url=${AUCTION_SERVICE_INTERNAL_URL:${AUCTION_INTERNAL_SERVICE_URL:http://localhost:8082/api/auctions/internal/}}
service.auth.url=${AUTH_INTERNAL_SERVICE_URL:http://localhost:8081/api/internal/users/}
service.auth.internal-token=${AUTH_INTERNAL_SERVICE_TOKEN:bidmart-internal-dev-token}